{% extends 'base.html' %}

{% block title %}Reset Failed | Hive{% endblock %}

{% block content_public %}
<div class="min-h-[60vh] flex items-center justify-center bg-slate-900/50 rounded-3xl p-4 sm:p-8 shadow-xl border border-slate-800 bg-gradient-to-tr from-slate-900 via-slate-950 to-slate-900">
    <div class="w-full max-w-md bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-slate-100 text-slate-800 text-center">
        <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-rose-50 text-rose-600 mb-6 border border-rose-100 shadow-sm">
            <!-- X Circle Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-3">Reset Link Invalid</h2>
        <p class="text-sm text-slate-600 leading-relaxed mb-6">
            The password reset link is invalid or has expired. Please request another one.
        </p>

        <div class="border-t border-slate-100 pt-6">
            <a href="{% url 'accounts:forgot_password' %}" class="w-full inline-flex items-center justify-center rounded-xl bg-brand-600 px-4 py-3 text-sm font-semibold text-white shadow-md hover:bg-brand-500 transition-all">
                Request New Reset Link
            </a>
        </div>

        <p class="mt-8 text-xs text-slate-400">
            Back to <a href="{% url 'accounts:login' %}" class="font-bold text-brand-600 hover:text-brand-500 transition-colors">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
