{% extends 'base.html' %}

{% block title %}Password Reset Sent | Hive{% endblock %}

{% block content_public %}
<div class="min-h-[60vh] flex items-center justify-center bg-slate-900/50 rounded-3xl p-4 sm:p-8 shadow-xl border border-slate-800 bg-gradient-to-tr from-slate-900 via-slate-950 to-slate-900">
    <div class="w-full max-w-md bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-slate-100 text-slate-800 text-center">
        <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-brand-50 text-brand-600 mb-6 border border-brand-100 shadow-sm">
            <!-- Key Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
            </svg>
        </div>

        <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-3">Reset Email Sent</h2>
        <p class="text-sm text-slate-600 leading-relaxed mb-6">
            If a verified account is associated with that email, we have sent instructions to reset your password. 
            Please check your inbox.
        </p>

        <p class="mt-8 text-xs text-slate-400">
            Back to <a href="{% url 'accounts:login' %}" class="font-bold text-brand-600 hover:text-brand-500 transition-colors">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
