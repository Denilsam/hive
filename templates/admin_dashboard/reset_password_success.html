<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Successful | {{ site_branding.site_name }} Portal</title>
  <link rel="icon" href="{{ site_branding.favicon_url }}?v={{ site_branding.updated_at_timestamp }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 text-center">
    <div class="space-y-3">
      <a href="{% url 'admin_dashboard:admin_login' %}" class="inline-block" aria-label="{{ site_branding.site_name }}">
        <img src="{{ site_branding.admin_logo_url }}?v={{ site_branding.updated_at_timestamp }}" alt="{{ site_branding.site_name }}" class="h-10 w-auto max-h-10 max-w-[180px] object-contain mx-auto">
      </a>
      <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-xl font-bold">
        ✓
      </div>
      <h1 class="text-xl font-extrabold tracking-tight text-white">Password Reset Complete</h1>
      <p class="text-xs text-slate-300 leading-relaxed max-w-sm mx-auto">
        Your admin password has been reset successfully.
      </p>
    </div>

    <div class="pt-2">
      <a href="{% url 'admin_dashboard:admin_login' %}" class="inline-block w-full py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-extrabold shadow-lg shadow-indigo-600/30 transition-colors">
        Return to Admin Login
      </a>
    </div>
  </div>
</body>
</html>
