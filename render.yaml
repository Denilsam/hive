services:
  - type: web
    name: hive-platform
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ENABLE_EMAIL_OTP
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: hive-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hive-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"

  - type: redis
    name: hive-redis
    plan: free
    ipAllowList: []

databases:
  - name: hive-postgres
    databaseName: connect_hive
    user: connect_user
    plan: free
